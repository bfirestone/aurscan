name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Incremental artifacts never get reused on a fresh runner.
  CARGO_INCREMENTAL: 0

jobs:
  # Rust gate. Runs on ubuntu because the test suite is hermetic — every test
  # drives fixtures under crates/aurscan-cli/tests/, and the one test that
  # touches a real pacman database (audit::tests) asserts the *missing* case.
  # Nothing here needs Arch.
  rust:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      # Tag runs gate a release, so they build from scratch. A cache written by
      # an earlier run can't feed into them.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          lookup-only: ${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # --locked so a drifting Cargo.lock fails here rather than inside
      # makepkg, where build() also passes --locked.
      - name: Test
        run: cargo test --workspace --locked

  # Supply-chain gate: RustSec advisories, licenses, wildcard deps and
  # registry sources, as configured in deny.toml.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --workspace

  # Packaging gate. .SRCINFO is generated metadata that the AUR reads *instead
  # of* parsing the PKGBUILD, so the two silently diverging is the classic AUR
  # maintenance bug: users resolve stale deps/sources while the repo looks
  # correct. This regenerates it and fails on any diff.
  packaging:
    name: PKGBUILD / .SRCINFO consistency
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install packaging tools
        run: pacman -Syu --noconfirm --needed pacman-contrib namcap

      # makepkg refuses to run as root.
      - name: Create build user
        run: |
          useradd -m builder
          chown -R builder:builder .

      - name: Check .SRCINFO is in sync with PKGBUILD
        run: |
          su builder -c 'makepkg --printsrcinfo' > .SRCINFO.generated
          if ! diff -u .SRCINFO .SRCINFO.generated; then
            echo "::error::.SRCINFO is stale. Regenerate with: makepkg --printsrcinfo > .SRCINFO"
            exit 1
          fi

      - name: Lint PKGBUILD
        run: namcap PKGBUILD
