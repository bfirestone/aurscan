# Release automation, driven by release-please.
#
# Every push to main updates the release PR. That PR bumps the version in
# Cargo.toml and PKGBUILD and updates CHANGELOG.md. The sync job then
# refreshes Cargo.lock and .SRCINFO, which release-please can't edit.
# Merging the PR tags vX.Y.Z and creates a draft GitHub release.
#
# The asset job builds the tarball that PKGBUILD downloads. It uses `git
# archive` and runs makepkg on that tarball in a clean Arch container. The
# publish job attests the tarball and uploads it to the draft. Then it
# publishes the release and lands the checksum pin on main through a PR.
# With release immutability on, the published asset can't change after
# that. PKGBUILD pins sha256sums to this uploaded tarball, not GitHub's
# on-the-fly tag archive, because the uploaded file is a fixed byte string.
#
# main requires PRs and verified signatures, so bot commits go through the
# GraphQL API, which GitHub signs (.github/scripts/signed-commit.sh). They use
# a GitHub App token when RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY
# are configured. Otherwise they fall back to GITHUB_TOKEN, whose commits
# don't trigger CI on the release PR or the pin PR. Tags made with
# GITHUB_TOKEN don't trigger other workflows either, which is why the asset
# jobs live here.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release PR and draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag and draft release
      pull-requests: write # release PR
      issues: write # release PR labels
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        if: vars.RELEASE_APP_CLIENT_ID != ''
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps Cargo.toml and PKGBUILD but not the derived files.
  # Without this, `cargo --locked` and the .SRCINFO consistency check fail
  # on every release PR.
  release-pr-sync:
    name: sync Cargo.lock and .SRCINFO on the release PR
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit to the release PR branch
    env:
      PR_JSON: ${{ needs.release-please.outputs.pr }}
    steps:
      - name: Read the release branch name
        run: |
          branch=$(printf '%s' "$PR_JSON" | jq -r '.headBranchName')
          if ! [[ "$branch" =~ ^release-please--[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Unexpected release branch name '$branch'"
            exit 1
          fi
          echo "BRANCH=$branch" >> "$GITHUB_ENV"

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        if: vars.RELEASE_APP_CLIENT_ID != ''
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false

      - name: Sync Cargo.lock
        run: cargo update --workspace

      # makepkg --printsrcinfo sources the PKGBUILD, so it gets only the
      # packaging files, mounted read-only and without the token in .git.
      - name: Regenerate .SRCINFO
        run: |
          docker run --rm \
            -v "$PWD/PKGBUILD:/in/PKGBUILD:ro" \
            -v "$PWD/aurscan.install:/in/aurscan.install:ro" \
            archlinux:base-devel \
            bash -c 'useradd -m builder && cp -r /in /home/builder/b && chown -R builder:builder /home/builder/b && su builder -c "cd ~/b && makepkg --printsrcinfo"' \
            > .SRCINFO

      # The release PR's commits land on main, which requires verified
      # signatures, so the fixup goes through the API instead of git push.
      - name: Commit fixups to the release PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "Cargo.lock and .SRCINFO already in sync."
            exit 0
          fi
          .github/scripts/signed-commit.sh "$BRANCH" "$(git rev-parse HEAD)" \
            "chore: sync Cargo.lock and .SRCINFO" "${changed[@]}"

  asset:
    name: build and verify the release asset
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VER: ${{ needs.release-please.outputs.version }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git rust

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Check versions match the tag
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cargo_ver=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          pkg_ver=$(sed -n 's/^pkgver=\([^ ]*\).*/\1/p' PKGBUILD)
          echo "tag=$TAG release=$VER Cargo.toml=$cargo_ver PKGBUILD=$pkg_ver"
          if [ "$TAG" != "v$VER" ] || [ "$cargo_ver" != "$VER" ] || [ "$pkg_ver" != "$VER" ]; then
            echo "::error::Cargo.toml and PKGBUILD must both say $VER"
            exit 1
          fi

      - name: Build the asset
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="aurscan-$VER/" -o "dist/aurscan-$VER.tar.gz" "$TAG"
          (cd dist && sha256sum "aurscan-$VER.tar.gz" > "aurscan-$VER.tar.gz.sha256")
          cat "dist/aurscan-$VER.tar.gz.sha256"

      # makepkg finds the tarball next to the PKGBUILD and skips the download,
      # so this tests the exact bytes about to be published.
      - name: Build and package from the asset
        run: |
          sha=$(cut -d' ' -f1 "dist/aurscan-$VER.tar.gz.sha256")
          useradd -m builder
          mkdir /tmp/build
          cp PKGBUILD aurscan.install "dist/aurscan-$VER.tar.gz" /tmp/build/
          sed -i "s/^sha256sums=.*/sha256sums=('$sha')/" /tmp/build/PKGBUILD
          chown -R builder:builder /tmp/build
          su builder -c 'cd /tmp/build && makepkg --noconfirm'
          bsdtar -xOf /tmp/build/aurscan-"$VER"-*.pkg.tar.zst usr/bin/aurscan > /tmp/aurscan
          chmod +x /tmp/aurscan
          /tmp/aurscan --version | grep -qx "aurscan $VER"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-asset
          path: dist/
          if-no-files-found: error

  # Split from the asset job so makepkg, cargo and every dependency's build
  # script never run next to a write token or an OIDC signing token.
  publish:
    name: attest, upload, publish and pin
    needs: [release-please, asset]
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the asset, publish the release, commit the pin
      pull-requests: write # open and merge the pin PR
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VER: ${{ needs.release-please.outputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-asset
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/aurscan-${{ needs.release-please.outputs.version }}.tar.gz

      # A rerun can find the asset already uploaded. Accept it only if the
      # bytes match, because users may already have pinned its checksum.
      - name: Upload to the draft and publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="aurscan-$VER.tar.gz"
          if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx "$asset"; then
            gh release download "$TAG" -p "$asset" -D existing
            if ! cmp -s "existing/$asset" "dist/$asset"; then
              echo "::error::$TAG already has a different $asset"
              exit 1
            fi
            echo "$asset already uploaded with identical bytes."
          else
            gh release upload "$TAG" "dist/$asset" "dist/$asset.sha256"
          fi
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true" ]; then
            gh release edit "$TAG" --draft=false --latest
          fi

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        if: vars.RELEASE_APP_CLIENT_ID != ''
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: repo
          persist-credentials: false

      # main requires a PR and verified signatures. The pin goes on its own
      # branch as an API commit, which GitHub signs. A squash merge then
      # lands it on main as another GitHub-signed commit.
      - name: Pin the checksum through a PR
        working-directory: repo
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          sha=$(cut -d' ' -f1 "../dist/aurscan-$VER.tar.gz.sha256")
          pkg_ver=$(sed -n 's/^pkgver=\([^ ]*\).*/\1/p' PKGBUILD)
          if [ "$pkg_ver" != "$VER" ]; then
            echo "::error::main's PKGBUILD says $pkg_ver, not $VER. Pin it by hand."
            exit 1
          fi
          old=$(sed -n "s/^sha256sums=('\([0-9a-f]*\)')$/\1/p" PKGBUILD)
          if [ "$old" = "$sha" ]; then
            echo "PKGBUILD already pins $sha."
            exit 0
          fi
          sed -i "s/$old/$sha/" PKGBUILD .SRCINFO
          grep -qx "sha256sums=('$sha')" PKGBUILD
          grep -qx "	sha256sums = $sha" .SRCINFO

          pin="release-pin/$TAG"
          title="build(pkgbuild): point at the $TAG release asset"
          head=$(git rev-parse HEAD)
          if ! gh api "repos/$GH_REPO/git/ref/heads/$pin" >/dev/null 2>&1; then
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/heads/$pin" -f sha="$head" >/dev/null
            .github/scripts/signed-commit.sh "$pin" "$head" "$title" PKGBUILD .SRCINFO
          fi
          if [ "$(gh pr view "$pin" --json state -q .state 2>/dev/null)" != "OPEN" ]; then
            gh pr create --base main --head "$pin" --title "$title" \
              --body "Pins \`sha256sums\` to the published $TAG asset: \`$sha\`."
          fi
          if ! gh pr merge "$pin" --squash --delete-branch; then
            echo "::warning::The pin PR couldn't be merged automatically. Merge it by hand."
          fi

      - name: Summary
        run: |
          {
            echo "## aurscan $TAG published"
            echo
            echo "Asset sha256: \`$(cut -d' ' -f1 "dist/aurscan-$VER.tar.gz.sha256")\`"
            echo
            echo "Verify provenance: \`gh attestation verify aurscan-$VER.tar.gz -R $GH_REPO\`"
          } >> "$GITHUB_STEP_SUMMARY"
