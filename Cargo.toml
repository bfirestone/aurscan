[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rayon = "1.10"
blake3 = "1"
redb = "2"
aho-corasick = "1"
regex = "1"
sha2 = "0.10"
tree-sitter = "0.24"
tree-sitter-bash = "0.23"
goblin = "0.9"
tar = "0.4"
zstd = "0.13"
ureq = { version = "2", features = ["json"] }
clap = { version = "4", features = ["derive"] }
walkdir = "2"
dirs = "5"
tempfile = "3"
