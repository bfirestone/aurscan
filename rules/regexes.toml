version = 1

[[regex]]
pattern = '(curl|wget)[^|;\n]*\|\s*(ba)?sh'
severity = "high"
label = "download piped directly to shell"

[[regex]]
pattern = 'base64\s+(-d|--decode)[^\n]*\|\s*(ba)?sh'
severity = "high"
label = "base64-decoded content piped to shell"

[[regex]]
pattern = 'eval\s+"?\$\((curl|wget|base64)'
severity = "high"
label = "eval of downloaded/decoded content"

[[regex]]
pattern = 'https?://(\d{1,3}\.){3}\d{1,3}'
severity = "medium"
label = "raw-IP URL"

[[regex]]
pattern = '(bit\.ly|tinyurl\.com|t\.co|goo\.gl|is\.gd)/'
severity = "medium"
label = "URL shortener"

[[regex]]
pattern = 'chmod\s+[0-7]*[4-7][0-7]{2}\s+.*&&.*(/tmp|/dev/shm)'
severity = "high"
label = "executable staged in tmpfs"
